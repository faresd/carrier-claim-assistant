<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carrier Claim Assistant — Promotional tile</title>
    <style>
      * { box-sizing: border-box; }
      body { width: 440px; height: 280px; margin: 0; overflow: hidden; color: white; background: #0b223d; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { position: relative; width: 100%; height: 100%; padding: 35px 38px; background: radial-gradient(circle at 92% 12%, #275987 0, #173b67 26%, transparent 52%); }
      main::after { content: ""; position: absolute; width: 180px; height: 180px; right: -45px; bottom: -55px; border: 25px solid #ed7e20; border-radius: 50%; opacity: .9; }
      .top { display: flex; align-items: center; gap: 16px; }
      img { width: 74px; height: 74px; filter: drop-shadow(0 8px 16px #0005); }
      .eyebrow { color: #ffb565; font-size: 12px; font-weight: 800; letter-spacing: .14em; }
      h1 { margin: 5px 0 0; font-size: 26px; line-height: 1.05; }
      p { position: relative; z-index: 1; width: 320px; margin: 24px 0 0; color: #d9e6f2; font-size: 15px; line-height: 1.4; }
      .carriers { margin-top: 18px; color: white; font-size: 12px; font-weight: 800; letter-spacing: .05em; }
    </style>
  </head>
  <body>
    <main>
      <div class="top"><img src="../icons/icon128.png" alt=""><div><div class="eyebrow">DELIVERY STATUS + CLAIMS</div><h1>Carrier Claim<br>Assistant</h1></div></div>
      <p>Check official tracking, review the detected issue, and prepare the right carrier claim.</p>
      <div class="carriers">COLISSIMO · LA POSTE · CHRONOPOST</div>
    </main>
  </body>
</html>
