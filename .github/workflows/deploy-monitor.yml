name: Deploy return monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "monitor-service/**"
      - ".github/workflows/deploy-monitor.yml"

permissions:
  contents: read

concurrency:
  group: carrier-return-monitor-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test monitor classification
        run: npm --prefix monitor-service test
      - name: Validate deployment configuration
        env:
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          LAPOSTE_OKAPI_KEY: ${{ secrets.LAPOSTE_OKAPI_KEY }}
          MONITOR_SESSION_SECRET: ${{ secrets.MONITOR_SESSION_SECRET }}
          MONITOR_TRACKING_CLIENT_SECRET: ${{ secrets.MONITOR_TRACKING_CLIENT_SECRET }}
        run: node monitor-service/scripts/validate-deployment-env.mjs
      - name: Configure D1 database binding
        env:
          D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
        run: sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$D1_DATABASE_ID/" monitor-service/wrangler.toml
      - name: Apply database migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ vars.CF_ACCOUNT_ID }}
          workingDirectory: monitor-service
          command: d1 migrations apply carrier-return-monitor --remote
      - name: Deploy Worker, dashboard, queue consumer, and scheduler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ vars.CF_ACCOUNT_ID }}
          workingDirectory: monitor-service
          secrets: |
            LAPOSTE_OKAPI_KEY
            SESSION_SECRET
            TRACKING_CLIENT_SECRET
        env:
          LAPOSTE_OKAPI_KEY: ${{ secrets.LAPOSTE_OKAPI_KEY }}
          SESSION_SECRET: ${{ secrets.MONITOR_SESSION_SECRET }}
          TRACKING_CLIENT_SECRET: ${{ secrets.MONITOR_TRACKING_CLIENT_SECRET }}
      - name: Verify the live dashboard and authentication boundary
        env:
          MONITOR_BASE_URL: https://tracking.cheaply.fr
        run: node monitor-service/scripts/smoke-production.mjs
