name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run tests
        run: npm test
      - name: Verify generated visual assets
        run: npm run generate:assets && git diff --exit-code -- icons store-assets/*.png
      - name: Build Chrome Web Store package
        run: npm run package
      - name: Upload verified package
        uses: actions/upload-artifact@v7
        with:
          name: carrier-claim-assistant
          path: dist/*.zip
          if-no-files-found: error
