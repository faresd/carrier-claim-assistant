name: Apply backend carrier-monitor feature

on:
  push:
    branches: [fix/pending-laposte-ci]
    paths:
      - carrier-feature.patch
      - .github/workflows/apply-backend-feature.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/pending-laposte-ci
          fetch-depth: 0
      - name: Apply feature commit
        run: |
          set -euo pipefail
          test -f carrier-feature.patch
          git apply --3way --index carrier-feature.patch
          git rm carrier-feature.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add authenticated Shopify return-monitor integration"
          git push origin HEAD:fix/pending-laposte-ci
